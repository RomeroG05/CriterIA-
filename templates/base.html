{% load i18n static %}{% get_current_language as LANGUAGE_CODE %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>{% block title %}CriterIA{% endblock %}</title>
  <meta name="description" content="{% translate 'Asistente para explorar dilemas éticos en inteligencia artificial, comunicación y periodismo.' %}">
  <meta name="color-scheme" content="light dark">
  {% block theme_color %}
  <meta name="theme-color" content="#f3f5f8" data-light="#f3f5f8" data-dark="#0c1623" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1623" data-light="#f3f5f8" data-dark="#0c1623" media="(prefers-color-scheme: dark)">
  {% endblock %}
  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="48x48">
  <link rel="icon" href="{% static 'img/favicon-32.png' %}" type="image/png" sizes="32x32">
  <link rel="icon" href="{% static 'img/icon-192.png' %}" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="preload" href="{% static 'fonts/public-sans-latin-wght.woff2' %}" as="font" type="font/woff2" crossorigin>
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t) {
        document.documentElement.dataset.theme = t;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = m.getAttribute("data-" + t) || m.content; });
      }
    } catch (e) {}
  </script>
  <style>
    @font-face{font-family:"Public Sans";src:url("{% static 'fonts/public-sans-latin-wght.woff2' %}") format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:"Public Sans";src:url("{% static 'fonts/public-sans-latin-ext-wght.woff2' %}") format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
    @font-face{font-family:"Source Serif 4";src:url("{% static 'fonts/source-serif-4-latin-opsz.woff2' %}") format("woff2");font-weight:200 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:"Source Serif 4";src:url("{% static 'fonts/source-serif-4-latin-ext-opsz.woff2' %}") format("woff2");font-weight:200 900;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
    @font-face{font-family:"JetBrains Mono";src:url("{% static 'fonts/jetbrains-mono-latin-wght.woff2' %}") format("woff2");font-weight:100 800;font-display:swap}
  </style>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% include "chat/_icons.html" %}
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
